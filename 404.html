.notfound-btn-secondary:hover{background:rgba(201,169,110,.06);border-color:rgba(201,169,110,.7)}
.notfound-links{margin-top:56px;display:flex;gap:32px;flex-wrap:wrap;justify-content:center}
.notfound-link{font-size:12px;color:var(--gray-muted);text-decoration:none;letter-spacing:.06em;transition:color .2s}
