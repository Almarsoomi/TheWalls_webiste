<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Dashboard | The Walls</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="icon" type="image/x-icon" href="../assets/images/favicon/favicon.ico"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../assets/css/style.css"/>
<script>document.documentElement.setAttribute('data-theme',localStorage.getItem('tw_theme')||'dark');</script>
<style>
/* ── SECURITY SECTION ──────────────────────────────────────── */
.security-section{margin-top:56px;padding-top:40px;border-top:.5px solid rgba(201,169,110,.08)}
.security-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.security-title-row{display:flex;align-items:center;gap:10px}
.security-eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--champagne);margin-bottom:6px}
.security-title{font-family:var(--serif);font-size:22px;font-weight:300;color:var(--cream)}
.security-badge{display:inline-flex;align-items:center;padding:3px 9px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-family:var(--sans)}
.security-badge-blocked{background:rgba(210,80,80,.1);color:#d25050;border:.5px solid rgba(210,80,80,.3)}
.security-badge-warning{background:rgba(232,168,78,.08);color:#e8a84e;border:.5px solid rgba(232,168,78,.25)}
.security-badge-clear{background:rgba(122,204,122,.08);color:#7acc7a;border:.5px solid rgba(122,204,122,.2)}
.security-refresh-btn{display:flex;align-items:center;gap:7px;padding:8px 16px;background:transparent;border:.5px solid rgba(201,169,110,.3);color:var(--champagne);font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:background .2s}
.security-refresh-btn:hover{background:rgba(201,169,110,.06)}
.sec-table{width:100%;border-collapse:collapse;font-size:13px}
.sec-table th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray-muted);padding:8px 12px;text-align:left;border-bottom:.5px solid rgba(201,169,110,.1)}
.sec-table td{padding:12px;border-bottom:.5px solid rgba(201,169,110,.05);vertical-align:middle}
.sec-table tr:last-child td{border-bottom:none}
.sec-ip{font-family:monospace;font-size:12px;color:var(--cream)}
.sec-tier-chip{display:inline-block;padding:2px 8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:rgba(107,107,104,.12);color:var(--gray-mid)}
.sec-blocked-text{color:#d25050;font-size:12px}
.sec-timer{font-family:var(--display);font-size:18px;color:#d25050;letter-spacing:.04em}
.sec-clear-text{color:rgba(107,107,104,.4);font-size:12px}
.sec-unblock-btn{padding:4px 12px;background:transparent;border:.5px solid rgba(201,169,110,.3);color:var(--champagne);font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:background .2s}
.sec-unblock-btn:hover{background:rgba(201,169,110,.08)}
.security-empty{padding:24px 12px;color:var(--gray-muted);font-size:13px;display:flex;align-items:center;gap:10px}
.security-empty::before{content:'';width:20px;height:.5px;background:var(--gray-muted)}
.security-auto{font-size:11px;color:rgba(107,107,104,.4);margin-top:10px;letter-spacing:.04em}
</style>
</head>
<body>

<div class="cursor" id="cur"></div>
<div class="cursor-ring" id="curR"></div>

<!-- ADMIN NAV -->
<nav id="mainNav" class="admin-nav">
  <a href="../index.html" class="nav-logo">
    <img src="../assets/images/Logo/TheWallsLogo.png" alt="The Walls" style="height:100px;width:auto;"/>
  </a>
  <div class="nav-links" style="display:flex;align-items:center;gap:4px;">
    <a href="./admin-dashboard.html" style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;padding:7px 14px;border-radius:4px;color:var(--champagne,#c9a96e);background:rgba(201,169,110,.1);">Projects</a>
    <a href="./admin-quotes.html" style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;padding:7px 14px;border-radius:4px;color:rgba(201,169,110,.45);transition:color .2s;" onmouseover="this.style.color='rgba(201,169,110,.75)'" onmouseout="this.style.color='rgba(201,169,110,.45)'">Quotes</a>
    <a href="./admin-orders.html" style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;padding:7px 14px;border-radius:4px;color:rgba(201,169,110,.45);transition:color .2s;" onmouseover="this.style.color='rgba(201,169,110,.75)'" onmouseout="this.style.color='rgba(201,169,110,.45)'">Orders</a>
  </div>
  <div class="nav-right">
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Switch theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><line x1="12" y1="2" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="22"/><line x1="2" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="22" y2="12"/><line x1="4.93" y1="4.93" x2="6.7" y2="6.7"/><line x1="17.3" y1="17.3" x2="19.07" y2="19.07"/><line x1="4.93" y1="19.07" x2="6.7" y2="17.3"/><line x1="17.3" y1="6.7" x2="19.07" y2="4.93"/></svg></button>
    <button class="nav-cta nav-logout" onclick="adminLogout()" style="background:transparent;border:0.5px solid rgba(201,169,110,0.4);cursor:pointer;">Log Out</button>
  </div>
</nav>

<div class="admin-wrap">
  <div class="admin-page-header">
    <div>
      <div class="admin-eyebrow">The Walls</div>
      <h1 class="admin-page-title">Projects</h1>
    </div>
    <button class="btn-send-db" onclick="openNewProjectModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;margin-right:8px;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span>New Project</span>
    </button>
  </div>

  <!-- LOADING -->
  <div class="admin-loading" id="adminLoading">
    <div class="portal-loading-spinner"></div>
    <p>Loading projects…</p>
  </div>

  <!-- TOOLBAR -->
  <div class="admin-toolbar" id="adminToolbar" style="display:none;">
    <input type="text" class="admin-search" id="dashSearch" placeholder="Search projects or clients…" oninput="applyFilters()"/>
    <select class="admin-filter-select" id="dashStatus" onchange="applyFilters()">
      <option value="">All Statuses</option>
      <option value="active">In Progress</option>
      <option value="on-hold">On Hold</option>
      <option value="completed">Completed</option>
    </select>
    <select class="admin-filter-select" id="dashSort" onchange="applyFilters()">
      <option value="created_desc">Newest First</option>
      <option value="created_asc">Oldest First</option>
      <option value="start_asc">Start Date ↑</option>
      <option value="start_desc">Start Date ↓</option>
    </select>
  </div>

  <!-- PROJECTS TABLE -->
  <div class="admin-table-wrap" id="adminTableWrap" style="display:none;">
    <table class="admin-table" id="projectsTable">
      <thead>
        <tr>
          <th>Project</th>
          <th>Client</th>
          <th>Status</th>
          <th>Created</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="projectsBody"></tbody>
    </table>
    <div class="admin-empty" id="adminEmpty" style="display:none;">
      <p>No projects match your search.</p>
    </div>
  </div>

  <!-- SECURITY SECTION -->
  <div class="security-section" id="securitySection" style="display:none;">
    <div class="security-header">
      <div>
        <div class="security-eyebrow">Monitoring</div>
        <div class="security-title">Login Security</div>
      </div>
      <button class="security-refresh-btn" onclick="loadSecurityLog()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:13px;height:13px;"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Refresh
      </button>
    </div>
    <table class="sec-table" id="secTable">
      <thead>
        <tr>
          <th>IP Address</th>
          <th>Phase</th>
          <th>Attempts</th>
          <th>Block Expires</th>
          <th>Last Attempt</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="secBody"></tbody>
    </table>
    <div class="security-empty" id="secEmpty" style="display:none;">No suspicious activity recorded.</div>
    <div class="security-auto" id="secAutoLabel"></div>
  </div>

</div><!-- /admin-wrap -->

<!-- NEW PROJECT MODAL -->
<div class="est-modal-overlay" id="newProjectModal" onclick="closeNewProjectModal()">
  <div class="est-modal admin-modal" onclick="event.stopPropagation()" style="max-width:520px;">
    <h3 class="est-modal-title">New Project</h3>
    <div class="form-grid" style="margin-top:24px;">
      <div class="form-group full">
        <label class="form-label">Project name *</label>
        <input type="text" class="form-input" id="npName" placeholder="Marina Penthouse Fit-Out"/>
      </div>
      <div class="form-group">
        <label class="form-label">Client name *</label>
        <input type="text" class="form-input" id="npClientName" placeholder="Ahmed Al Rashidi"/>
      </div>
      <div class="form-group">
        <label class="form-label">Client email *</label>
        <input type="email" class="form-input" id="npClientEmail" placeholder="client@example.com"/>
      </div>
      <div class="form-group">
        <label class="form-label">Start date</label>
        <input type="date" class="form-input" id="npStartDate"/>
      </div>
      <div class="form-group">
        <label class="form-label">Expected completion</label>
        <input type="date" class="form-input" id="npCompletion"/>
      </div>
      <div class="form-group full">
        <label class="form-label">Status</label>
        <select class="form-input" id="npStatus">
          <option value="active">In Progress</option>
          <option value="on-hold">On Hold</option>
          <option value="completed">Completed</option>
        </select>
      </div>
    </div>
    <div class="form-status" id="newProjectStatus" style="display:none;margin-top:12px;"></div>
    <div style="display:flex;gap:12px;margin-top:24px;">
      <button class="btn-send-db" id="btnCreateProject" onclick="createProject()" style="flex:1;"><span>Create Project</span></button>
      <button class="est-modal-close" onclick="closeNewProjectModal()" style="flex:0 0 auto;padding:14px 20px;">Cancel</button>
    </div>
  </div>
</div>

<script src="../assets/js/main.js"></script>
<script>
const ADMIN_KEY = localStorage.getItem('admin_key');
const ADMIN_PROJECTS_URL = 'https://xpdfohzjjomrbzfatkpy.supabase.co/functions/v1/admin-projects';
const ADMIN_CONTENT_URL  = 'https://xpdfohzjjomrbzfatkpy.supabase.co/functions/v1/admin-content';

if (!ADMIN_KEY) window.location.href = './admin.html';

let _allProjects = [];
let _securityTimers = {};
let _securityRefreshTimer = null;

function adminLogout() {
  localStorage.removeItem('admin_key');
  window.location.href = './admin.html';
}

function openNewProjectModal() { document.getElementById('newProjectModal').classList.add('show'); }
function closeNewProjectModal() {
  document.getElementById('newProjectModal').classList.remove('show');
  document.getElementById('newProjectStatus').style.display = 'none';
  ['npName','npClientName','npClientEmail','npStartDate','npCompletion'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('npStatus').value = 'active';
}

function statusBadge(s) {
  const map = { active: 'In Progress', completed: 'Completed', 'on-hold': 'On Hold' };
  return `<span class="portal-status-chip portal-status-${s}">${map[s] || s}</span>`;
}

function formatDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

function formatDateTime(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

// ── PROJECTS ─────────────────────────────────────────────────

function applyFilters() {
  const q = document.getElementById('dashSearch').value.toLowerCase();
  const status = document.getElementById('dashStatus').value;
  const sort = document.getElementById('dashSort').value;

  let list = _allProjects.filter(p => {
    const matchQ = !q || p.name.toLowerCase().includes(q) || p.client_name.toLowerCase().includes(q) || p.client_email.toLowerCase().includes(q);
    const matchStatus = !status || p.status === status;
    return matchQ && matchStatus;
  });

  list.sort((a, b) => {
    if (sort === 'created_asc') return new Date(a.created_at) - new Date(b.created_at);
    if (sort === 'start_asc') return new Date(a.start_date || 0) - new Date(b.start_date || 0);
    if (sort === 'start_desc') return new Date(b.start_date || 0) - new Date(a.start_date || 0);
    return new Date(b.created_at) - new Date(a.created_at);
  });

  renderProjects(list);
}

function renderProjects(list) {
  const body = document.getElementById('projectsBody');
  const empty = document.getElementById('adminEmpty');
  body.innerHTML = '';
  if (!list || list.length === 0) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  list.forEach(p => {
    const tr = document.createElement('tr');
    tr.id = `row-${p.id}`;
    tr.innerHTML = `
      <td class="admin-td-project"><a href="./admin-project.html?id=${p.id}" class="admin-project-link">${p.name}</a></td>
      <td><div class="admin-client-name">${p.client_name}</div><div class="admin-client-email">${p.client_email}</div></td>
      <td>${statusBadge(p.status)}</td>
      <td>${formatDate(p.created_at)}</td>
      <td class="admin-td-actions">
        <a href="./admin-project.html?id=${p.id}" class="admin-edit-btn">Edit →</a>
        <button class="admin-delete-row-btn" title="Delete project">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:14px;height:14px;"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
        </button>
      </td>
    `;
    tr.querySelector('.admin-delete-row-btn').addEventListener('click', () => deleteProject(p.id, p.name));
    body.appendChild(tr);
  });
}

async function deleteProject(id, name) {
  if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
  await fetch(ADMIN_PROJECTS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-admin-key': ADMIN_KEY },
    body: JSON.stringify({ action: 'delete', id }),
  });
  _allProjects = _allProjects.filter(p => p.id !== id);
  applyFilters();
}

async function loadProjects() {
  try {
    const res = await fetch(ADMIN_PROJECTS_URL, { headers: { 'x-admin-key': ADMIN_KEY } });
    if (res.status === 401) { window.location.href = './admin.html'; return; }
    _allProjects = await res.json() || [];
    document.getElementById('adminLoading').style.display = 'none';
    document.getElementById('adminToolbar').style.display = 'flex';
    document.getElementById('adminTableWrap').style.display = 'block';
    applyFilters();
  } catch (e) {
    document.getElementById('adminLoading').textContent = 'Failed to load projects.';
  }
}

async function createProject() {
  const name = document.getElementById('npName').value.trim();
  const clientName = document.getElementById('npClientName').value.trim();
  const clientEmail = document.getElementById('npClientEmail').value.trim();
  const status = document.getElementById('npStatus').value;
  const startDate = document.getElementById('npStartDate').value;
  const completion = document.getElementById('npCompletion').value;

  if (!name || !clientName || !clientEmail) {
    const s = document.getElementById('newProjectStatus');
    s.className = 'form-status error'; s.textContent = 'Please fill in all required fields.'; s.style.display = 'block';
    return;
  }

  const btn = document.getElementById('btnCreateProject');
  btn.disabled = true; btn.querySelector('span').textContent = 'Creating…';

  const res = await fetch(ADMIN_PROJECTS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-admin-key': ADMIN_KEY },
    body: JSON.stringify({ action: 'create', name, client_name: clientName, client_email: clientEmail, status, start_date: startDate || null, expected_completion: completion || null }),
  });

  const data = await res.json();
  btn.disabled = false; btn.querySelector('span').textContent = 'Create Project';

  if (data.success) {
    closeNewProjectModal();
    window.location.href = `./admin-project.html?id=${data.project.id}`;
  } else {
    const s = document.getElementById('newProjectStatus');
    s.className = 'form-status error'; s.textContent = data.error || 'Failed to create project.'; s.style.display = 'block';
  }
}

// ── SECURITY LOG ──────────────────────────────────────────────

const TIER_LABELS = ['Initial phase', 'Post 15-min block', 'Post 1-hour block'];

function secCountdown(blockedUntil, cellId) {
  function tick() {
    const el = document.getElementById(cellId);
    if (!el) return;
    const ms = Math.max(0, new Date(blockedUntil) - Date.now());
    if (ms <= 0) {
      el.innerHTML = '<span class="sec-clear-text">Expired</span>';
      return;
    }
    const total = Math.ceil(ms / 1000);
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    const display = h > 0
      ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
      : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    el.innerHTML = `<span class="sec-timer">${display}</span>`;
  }
  tick();
  if (_securityTimers[cellId]) clearInterval(_securityTimers[cellId]);
  _securityTimers[cellId] = setInterval(tick, 1000);
}

async function loadSecurityLog() {
  // Clear existing per-cell timers
  Object.values(_securityTimers).forEach(t => clearInterval(t));
  _securityTimers = {};

  const res = await fetch(ADMIN_CONTENT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-admin-key': ADMIN_KEY },
    body: JSON.stringify({ action: 'get-security-log' }),
  });
  const data = await res.json();
  const attempts = data.attempts || [];

  const section = document.getElementById('securitySection');
  section.style.display = 'block';

  const body = document.getElementById('secBody');
  const empty = document.getElementById('secEmpty');
  body.innerHTML = '';

  if (attempts.length === 0) {
    empty.style.display = 'flex';
    document.getElementById('secTable').style.display = 'none';
    document.getElementById('secAutoLabel').textContent = '';
    return;
  }

  empty.style.display = 'none';
  document.getElementById('secTable').style.display = 'table';

  attempts.forEach(a => {
    const isBlocked = a.blocked_until && new Date(a.blocked_until) > new Date();
    const tier = Math.min(a.block_tier ?? 0, 2);
    const cellId = `sec-timer-${a.ip.replace(/[.:]/g, '-')}`;

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>
        <span class="sec-ip">${a.ip}</span>
        ${isBlocked ? ' <span class="security-badge security-badge-blocked">Blocked</span>' : a.attempts > 2 ? ' <span class="security-badge security-badge-warning">Flagged</span>' : ''}
      </td>
      <td><span class="sec-tier-chip">${TIER_LABELS[tier] || 'Post 24h block'}</span></td>
      <td style="color:var(--cream)">${a.attempts}</td>
      <td id="${cellId}">—</td>
      <td style="color:var(--gray-mid);font-size:12px">${formatDateTime(a.last_attempt)}</td>
      <td>
        ${isBlocked
          ? `<button class="sec-unblock-btn" onclick="unblockIp('${a.ip}')">Unblock</button>`
          : `<span class="sec-clear-text" style="font-size:11px">Not blocked</span>`}
      </td>
    `;
    body.appendChild(tr);

    if (isBlocked) {
      secCountdown(a.blocked_until, cellId);
    } else if (a.blocked_until) {
      document.getElementById(cellId).innerHTML = '<span class="sec-clear-text">Expired</span>';
    } else {
      document.getElementById(cellId).innerHTML = '<span class="sec-clear-text">—</span>';
    }
  });

  const now = new Date();
  document.getElementById('secAutoLabel').textContent =
    `Last refreshed ${now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' })} · auto-refreshes every 30s`;
}

async function unblockIp(ip) {
  if (!confirm(`Unblock ${ip}?`)) return;
  await fetch(ADMIN_CONTENT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-admin-key': ADMIN_KEY },
    body: JSON.stringify({ action: 'unblock-ip', ip }),
  });
  loadSecurityLog();
}

// ── INIT ──────────────────────────────────────────────────────

loadProjects();
loadSecurityLog();

// Auto-refresh security log every 30 seconds
_securityRefreshTimer = setInterval(loadSecurityLog, 30000);
</script>
</body>
</html>
